name: Sync Knowledge Base

on:
  push:
    branches: ["main"]
    paths:
      - "_pages/about.md"
      - "_config.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate knowledge.md
        run: python assistant/sync_knowledge.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assistant/knowledge.md
          git diff --cached --quiet || git commit -m "chore: auto-sync knowledge base from homepage content"
          git push
